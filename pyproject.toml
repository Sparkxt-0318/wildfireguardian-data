[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfireguardian-data"
version = "0.1.0"
description = "Reproducible, provenance-preserving geospatial study-area packages for WildfireGuardian"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["geospatial", "provenance", "terrain", "road-network", "data-quality", "korea"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]

# Core dependencies deliberately exclude GDAL-backed packages: the scientific
# core (slope, aspect, statistics, clipping, graph QA, provenance, validation)
# runs without them. See docs/DECISIONS.md D-0003.
dependencies = [
  "numpy>=1.24",
  "pyproj>=3.4",
  "shapely>=2.0",
  "networkx>=3.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
# GeoTIFF / OGR I/O and raster reprojection.
geo = ["rasterio>=1.3", "geopandas>=0.14"]
test = ["pytest>=7.4"]
dev = ["pytest>=7.4", "rasterio>=1.3", "geopandas>=0.14", "ruff>=0.4"]

[project.scripts]
wg-data = "wildfireguardian_data.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not network"` is what actually makes the default run offline and
# deterministic, which AGENTS.md §7 and docs/VALIDATION.md both claim. A
# command-line `-m network` overrides it, which is how the live-source tests are
# run on purpose.
addopts = "-ra --strict-markers -m 'not network'"
markers = [
  "network: requires outbound network access; excluded from the default run",
  "geo: requires the [geo] extra (rasterio/GDAL)",
]
# RuntimeWarnings are errors: numpy raises them for invalid values in exactly
# the places this package cares about (division by zero, invalid arctan2,
# reductions over all-NaN slices), so a warning there is a defect, not noise.
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export the public API; those imports are not unused.
"src/wildfireguardian_data/**/__init__.py" = ["F401"]
"src/wildfireguardian_data/__init__.py" = ["F401"]
